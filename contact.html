<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 公司名稱</title>
</head>
<body>
    <nav>
        <a href="index.html">首頁</a> | 
        <a href="about.html">公司介紹</a> | 
        <a href="contact.html">聯絡我們</a>
    </nav>
    <hr>
    <h1>聯絡我們</h1>

    <form id="contactForm">
        <div>
            <label for="name">姓名：</label><br>
            <input type="text" id="name" name="name" required>
        </div><br>
        
        <div>
            <label for="phone">電話：</label><br>
            <input type="tel" id="phone" name="phone" required>
        </div><br>
        
        <div>
            <label for="email">Email：</label><br>
            <input type="email" id="email" name="email" required>
        </div><br>
        
        <div>
            <label for="message">聯絡內容：</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div><br>
        
        <button type="submit" id="submitBtn">送出表單</button>
    </form>

    <p id="statusMsg"></p>

    <script>
        // 你的 Google Apps Script Web App 專屬網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycby-GM7dc8A8PR37KvSRPYJw4inDjcEhW4BtlgwH9FEzQ3aMybq-4CDH11DG-x0Sz5Gvzw/exec";

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            
            submitBtn.disabled = true;
            statusMsg.textContent = "發送中，請稍候...";

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // 避開跨域限制
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMsg.textContent = "表單已成功送出！請至 lanenqueen1128@gmail.com 查收信件。";
                document.getElementById('contactForm').reset();
                submitBtn.disabled = false;
            })
            .catch(err => {
                statusMsg.textContent = "發送失敗，請稍後重試。";
                console.error(err);
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
